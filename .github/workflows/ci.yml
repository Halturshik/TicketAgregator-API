name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, Vet and Race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1 -timeout=5m

      - name: Race detector
        run: go test -race ./... -count=1 -timeout=10m

  integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/ticket_aggregator_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_aggregator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticket_aggregator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet integration tests
        run: go vet -tags=integration ./internal/integration

      - name: Integration tests with race detector
        run: go test -race -tags=integration ./internal/integration -count=1 -timeout=10m

  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate OpenAPI contract
        run: >-
          docker run --rm
          --volume "$PWD/docs:/spec:ro"
          redocly/cli:2.53.3
          lint --config /spec/redocly.yaml /spec/openapi.yaml

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build --target api --tag ticket-api:ci .

      - name: Build supplier image
        run: docker build --target supplier --tag supplier-simulator:ci .
